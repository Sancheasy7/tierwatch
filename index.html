<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TierWatch">
<meta name="theme-color" content="#0B0E14">
<title>TierWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #0B0E14; min-height: 100vh;
  }
  #tw-root {
    --bg: #0B0E14;
    --surface: #151922;
    --surface2: #1D2230;
    --border: #262B38;
    --text: #F5F3ED;
    --text-muted: #8A8F98;
    --gold: #F2B705;
    --gold-text: #3D2E00;
    --teal: #2DD4BF;
    --teal-text: #063A34;
    --violet: #A78BFA;
    --violet-text: #2E1F5E;
    --rose: #FB7185;
    --rose-text: #4A0E18;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
  }
  #tw-root button { font-family: inherit; cursor: pointer; }
  #tw-root input, #tw-root select {
    font-family: inherit; background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 15px; width: 100%;
  }
  #tw-root input:focus, #tw-root select:focus { outline: none; border-color: var(--gold); }
  .tw-perf {
    display: flex; gap: 7px; padding: 0 16px; height: 12px; align-items: center;
    background: repeating-linear-gradient(90deg, var(--surface2) 0 10px, transparent 10px 17px);
    opacity: .5;
  }
  .tw-perf span { width: 5px; height: 5px; border-radius: 50%; background: var(--bg); flex: none; }
</style>
</head>
<body>
<div id="tw-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var SUPABASE_URL = 'https://emyykdgwlnevamgblkfd.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_Ira79lbwSiToV0BUF-uWkA_9Cq7DZEk';
  var sb = null;

  var TIERS = ['S','A','B','C'];
  var TIER_SCORE = {S: 4, A: 3, B: 2, C: 1};
  var TIER_ORDER = ['C','B','A','S'];
  var TIER_META = {
    S: {color:'var(--gold)', text:'var(--gold-text)', label:'S TIER', sub:'unmissable'},
    A: {color:'var(--teal)', text:'var(--teal-text)', label:'A TIER', sub:'really good'},
    B: {color:'var(--violet)', text:'var(--violet-text)', label:'B TIER', sub:'solid'},
    C: {color:'var(--rose)', text:'var(--rose-text)', label:'C TIER', sub:'skippable'}
  };
  var OWNER_USERNAME = 'N.Sanchez';
  var DEFAULT_GENRES = ['Drama','Comedy','Sci-Fi','Fantasy','Crime','Reality','Animation','Documentary','Horror','Action'];

  var state = {
    user: null, users: [], shows: [], genres: [], allGenres: [], dbGenres: [],
    hiddenGenres: [], ranking: {},
    friendRanking: {}, tab: 'mytiers', genre: null, compareFriend: null,
    compareGenres: [], compareGenre: null, myFriends: [], manageFriendsOpen: false,
    allRankings: [], verdictGenres: [], verdictGenre: null,
    sheetShowId: null, loading: true, addGenreMode: false, addConfirm: null,
    addDraftTitle: '', addDraftGenre: '',
    profileSheetOpen: false, avatarUrl: null, userAvatars: {}, manageGenresOpen: false, managePeopleOpen: false,
    showAddToHome: false
  };

  var root = document.getElementById('tw-root');

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function isValidName(name){
    return /^[\p{L}\p{M}\p{N} .'-]{1,24}$/u.test(name);
  }

  function avatarCircle(username, size){
    size = size || 32;
    var url = state.userAvatars[username];
    var inner = url
      ? '<img src="' + esc(url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;" onerror="this.style.display=\'none\'" />'
      : esc(initials(username));
    return '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:' + Math.round(size * 0.4) + 'px;color:var(--text-muted);overflow:hidden;flex:none;">' + inner + '</div>';
  }

  function initials(name){
    var parts = String(name).trim().split(/\s+/);
    var out = parts[0] ? parts[0][0] : '?';
    if(parts.length>1) out += parts[parts.length-1][0];
    return out.toUpperCase();
  }

  function loadHiddenGenres(){
    try{
      var raw = localStorage.getItem('tw_hidden_genres');
      state.hiddenGenres = raw ? JSON.parse(raw) : [];
    }catch(e){ state.hiddenGenres = []; }
  }
  function saveHiddenGenres(){
    try{ localStorage.setItem('tw_hidden_genres', JSON.stringify(state.hiddenGenres)); }catch(e){}
  }

  function genreCount(g){
    return state.shows.filter(function(s){ return s.genre === g; }).length;
  }

  function computeGenres(){
    var set = {};
    DEFAULT_GENRES.forEach(function(g){ set[g] = true; });
    (state.dbGenres || []).forEach(function(g){ set[g] = true; });
    state.shows.forEach(function(s){
      if(s.addedBy === state.user || state.ranking[s.id]) set[s.genre] = true;
    });
    state.allGenres = Object.keys(set).sort();
    state.genres = state.allGenres.filter(function(g){ return state.hiddenGenres.indexOf(g) === -1; });
    if(!state.genre || state.genres.indexOf(state.genre) === -1) state.genre = state.genres[0] || null;
  }

  function computeCompareGenres(){
    var set = {};
    state.shows.forEach(function(s){
      if(s.addedBy === state.compareFriend || state.friendRanking[s.id]) set[s.genre] = true;
    });
    var list = Object.keys(set).filter(function(g){ return state.hiddenGenres.indexOf(g) === -1; }).sort();
    state.compareGenres = list;
    if(!state.compareGenre || list.indexOf(state.compareGenre) === -1) state.compareGenre = list[0] || null;
  }

  function computeVerdictGenres(){
    var counts = {};
    state.allRankings.forEach(function(r){ counts[r.show_id] = (counts[r.show_id] || 0) + 1; });
    var set = {};
    state.shows.forEach(function(s){ if((counts[s.id] || 0) >= 2) set[s.genre] = true; });
    var list = Object.keys(set).filter(function(g){ return state.hiddenGenres.indexOf(g) === -1; }).sort();
    state.verdictGenres = list;
    if(!state.verdictGenre || list.indexOf(state.verdictGenre) === -1) state.verdictGenre = list[0] || null;
  }

  async function loadVerdictData(){
    try{
      var r = await sb.from('rankings').select('user_name,show_id,tier');
      state.allRankings = r.data || [];
    }catch(e){ state.allRankings = state.allRankings || []; }
    computeVerdictGenres();
    render();
  }

  function verdictGenreCount(g){
    var counts = {};
    state.allRankings.forEach(function(r){ counts[r.show_id] = (counts[r.show_id] || 0) + 1; });
    return state.shows.filter(function(s){ return s.genre === g && (counts[s.id] || 0) >= 2; }).length;
  }

  async function init(){
    renderLoading();
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    loadHiddenGenres();
    var uname = localStorage.getItem('tw_username');
    if(!uname){ state.loading = false; renderOnboarding(); return; }
    state.user = uname;
    await loadShared();
    state.loading = false;
    state.showAddToHome = shouldShowAddToHome();
    render();
  }

  async function loadShared(){
    try{
      var u = await sb.from('users').select('name,avatar_url');
      state.users = (u.data || []).map(function(r){ return r.name; });
      var mine = (u.data || []).filter(function(r){ return r.name === state.user; })[0];
      state.avatarUrl = mine ? mine.avatar_url : null;
      var avatarMap = {};
      (u.data || []).forEach(function(r){ avatarMap[r.name] = r.avatar_url; });
      state.userAvatars = avatarMap;
    }catch(e){ state.users = state.users || []; }

    try{
      var s = await sb.from('shows').select('*').order('created_at', {ascending:true});
      state.shows = (s.data || []).map(function(r){
        return {id: r.id, title: r.title, genre: r.genre, poster: r.poster, addedBy: r.added_by};
      });
    }catch(e){ state.shows = state.shows || []; }

    try{
      var f = await sb.from('friendships').select('friend_name').eq('user_name', state.user);
      state.myFriends = (f.data || []).map(function(row){ return row.friend_name; });
    }catch(e){ state.myFriends = state.myFriends || []; }

    try{
      var g = await sb.from('genres').select('name');
      state.dbGenres = (g.data || []).map(function(r){ return r.name; });
    }catch(e){ state.dbGenres = state.dbGenres || []; }

    computeGenres();
    try{
      var r = await sb.from('rankings').select('show_id,tier').eq('user_name', state.user);
      var map = {};
      (r.data || []).forEach(function(row){ map[row.show_id] = row.tier; });
      state.ranking = map;
    }catch(e){ state.ranking = state.ranking || {}; }
  }

  async function claimUser(name){
    name = name.trim();
    if(!name || !isValidName(name)) return;
    try{
      var check = await sb.from('users').select('name,pin').eq('name', name).maybeSingle();
      if(check.data && check.data.pin){
        var entered = prompt('"' + name + '" is locked with a PIN. Enter it to continue:');
        if(entered === null) return;
        if(entered.trim() !== check.data.pin){ alert('Wrong PIN.'); return; }
      }
    }catch(e){}
    localStorage.setItem('tw_username', name);
    state.user = name;
    try{ await sb.from('users').upsert({name: name}); }catch(e){}
    await loadShared();
    state.showAddToHome = shouldShowAddToHome();
    render();
  }

  function shouldShowAddToHome(){
    try{
      if(localStorage.getItem('tw_addtohome_dismissed')) return false;
      var isStandalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if(isStandalone) return false;
      var ua = window.navigator.userAgent || '';
      return /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    }catch(e){ return false; }
  }

  function dismissAddToHome(){
    try{ localStorage.setItem('tw_addtohome_dismissed', '1'); }catch(e){}
    state.showAddToHome = false;
    render();
  }

  function addToHomeModal(){
    if(!state.showAddToHome) return '';
    var shareSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><rect x="5" y="11" width="14" height="10" rx="2"/></svg>';
    return '<div data-action="dismissaddtohome" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:7;padding:24px;">' +
        '<div data-action="stop" style="background:var(--surface);width:100%;max-width:340px;border-radius:16px;border:1px solid var(--border);padding:24px 20px;text-align:center;">' +
          '<div style="width:48px;height:48px;border-radius:12px;background:var(--surface2);color:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">' + shareSvg + '</div>' +
          '<div style="font-family:var(--font-display);font-size:22px;margin-bottom:8px;">GET THE APP</div>' +
          '<div style="font-size:14px;color:var(--text);line-height:1.5;margin-bottom:6px;">Add TierWatch to your Home Screen for the full app feel \u2014 no browser bar, just tap and go.</div>' +
          '<div style="font-size:14px;color:var(--text);line-height:1.5;margin-bottom:16px;">In Safari, tap the <strong>Share</strong> icon in your toolbar, then <strong>"Add to Home Screen."</strong></div>' +
          '<div style="font-size:12px;color:var(--text-muted);font-style:italic;margin-bottom:18px;">\u2013 Nathan</div>' +
          '<button data-action="dismissaddtohome" style="width:100%;background:var(--gold);color:var(--gold-text);border:none;border-radius:8px;padding:12px;font-weight:600;font-size:14px;">Got it</button>' +
        '</div>' +
      '</div>';
  }

  async function renameSelf(newName){
    newName = newName.trim();
    if(!newName || newName === state.user) return;
    if(!isValidName(newName)){ alert("Names can only use letters, numbers, spaces, and . ' - (no emojis or symbols)."); return; }
    if(state.users.indexOf(newName) !== -1){ alert('That name is already taken.'); return; }
    try{
      var res = await sb.from('users').update({name: newName}).eq('name', state.user);
      if(res.error){ alert("Couldn't rename (" + res.error.message + ")."); return; }
      var oldName = state.user;
      localStorage.setItem('tw_username', newName);
      state.user = newName;
      state.users = state.users.map(function(u){ return u === oldName ? newName : u; });
      state.shows = state.shows.map(function(s){
        return s.addedBy === oldName ? Object.assign({}, s, {addedBy: newName}) : s;
      });
      state.profileSheetOpen = false;
      render();
    }catch(e){
      alert("Couldn't rename. Check your connection and try again.");
    }
  }

  function changeNamePrompt(){
    var newName = prompt('Enter a new name', state.user);
    if(newName === null) return;
    renameSelf(newName);
  }

  function setPinPrompt(){
    var pin = prompt('Set a PIN (4-8 digits) to lock your name so only you can use it. Leave blank to remove your PIN.', '');
    if(pin === null) return;
    pin = pin.trim();
    if(pin && !/^[0-9]{4,8}$/.test(pin)){ alert('PIN must be 4 to 8 digits, numbers only.'); return; }
    savePin(pin || null);
  }

  async function savePin(pin){
    try{
      var res = await sb.from('users').update({pin: pin}).eq('name', state.user);
      if(res.error){ alert("Couldn't save (" + res.error.message + ")."); return; }
      alert(pin ? 'PIN set. Anyone using your name will need it from now on.' : 'PIN removed.');
      state.profileSheetOpen = false;
      render();
    }catch(e){
      alert("Couldn't save. Check your connection and try again.");
    }
  }

  async function clearPersonPin(username){
    if(!confirm("Clear " + username + "'s PIN? They'll be able to set a new one themselves.")) return;
    try{
      var res = await sb.from('users').update({pin: null}).eq('name', username);
      if(res.error){ alert("Couldn't clear PIN (" + res.error.message + ")."); return; }
      alert('PIN cleared for ' + username + '.');
    }catch(e){
      alert("Couldn't clear PIN. Check your connection and try again.");
    }
  }

  function switchUser(){
    if(!confirm('Switch user on this device?')) return;
    localStorage.removeItem('tw_username');
    state.user = null;
    state.ranking = {};
    state.avatarUrl = null;
    state.profileSheetOpen = false;
    renderOnboarding();
  }

  function openProfile(){
    state.profileSheetOpen = true;
    render();
  }
  function closeProfile(){
    state.profileSheetOpen = false;
    render();
  }
  function pickPhoto(){
    var input = document.getElementById('tw-avatar-input');
    if(input) input.click();
  }
  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale) || 1;
        var h = Math.round(img.height * scale) || 1;
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(blob){
          if(blob) resolve(blob); else reject(new Error('Could not process that image'));
        }, 'image/jpeg', quality);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('Could not read that image')); };
      img.src = url;
    });
  }

  function avatarPathFromUrl(url){
    if(!url) return null;
    var marker = '/avatars/';
    var idx = url.indexOf(marker);
    if(idx === -1) return null;
    return url.substring(idx + marker.length).split('?')[0];
  }

  async function uploadAvatar(file){
    if(!file) return;
    if(file.size > 30 * 1024 * 1024){ alert('That file is too large to process. Try a different photo.'); return; }
    var path = state.user.replace(/[^a-zA-Z0-9_-]/g, '_') + '_' + Date.now() + '.jpg';
    try{
      var blob = await compressImage(file, 480, 0.82);
      var up = await sb.storage.from('avatars').upload(path, blob, {upsert: true, cacheControl: '3600', contentType: 'image/jpeg'});
      if(up.error){ alert("Couldn't upload photo (" + up.error.message + ")."); return; }
      var pub = sb.storage.from('avatars').getPublicUrl(path);
      var url = pub.data.publicUrl;
      var res = await sb.from('users').upsert({name: state.user, avatar_url: url});
      if(res.error){ alert("Photo uploaded but couldn't save it to your profile (" + res.error.message + ")."); return; }
      var oldPath = avatarPathFromUrl(state.avatarUrl);
      state.avatarUrl = url;
      state.profileSheetOpen = false;
      render();
      if(oldPath){
        sb.storage.from('avatars').remove([oldPath]).catch(function(){});
      }
    }catch(e){
      alert((e && e.message) || "Couldn't upload photo. Check your connection and try again.");
    }
  }

  function setTab(tab){
    state.tab = tab;
    state.sheetShowId = null;
    render();
    if(tab === 'verdict') loadVerdictData();
  }

  function setGenre(g){
    state.genre = g;
    render();
  }

  function openSheet(id){
    state.sheetShowId = id;
    render();
  }
  function closeSheet(){
    state.sheetShowId = null;
    render();
  }

  async function setTier(showId, tier){
    var next = Object.assign({}, state.ranking);
    if(tier === null){ delete next[showId]; } else { next[showId] = tier; }
    state.ranking = next;
    state.sheetShowId = null;
    computeGenres();
    render();
    try{
      if(tier === null){
        await sb.from('rankings').delete().eq('user_name', state.user).eq('show_id', showId);
      } else {
        await sb.from('rankings').upsert(
          {user_name: state.user, show_id: showId, tier: tier},
          {onConflict: 'user_name,show_id'}
        );
      }
    }catch(e){
      alert("That ranking is saved here, but couldn't sync just now. It'll try again next time you open the app.");
    }
  }

  async function selectFriend(name){
    state.compareFriend = name || null;
    if(name){
      try{
        var r = await sb.from('rankings').select('show_id,tier').eq('user_name', name);
        var map = {};
        (r.data || []).forEach(function(row){ map[row.show_id] = row.tier; });
        state.friendRanking = map;
      }catch(e){ state.friendRanking = {}; }
    } else {
      state.friendRanking = {};
    }
    state.compareGenre = null;
    computeCompareGenres();
    render();
  }

  async function editShow(showId){
    var show = state.shows.filter(function(s){ return s.id === showId; })[0];
    if(!show) return;
    var newTitle = prompt('Edit title', show.title);
    if(newTitle === null) return;
    newTitle = newTitle.trim();
    if(!newTitle || newTitle === show.title) return;
    try{
      var res = await sb.from('shows').update({title: newTitle}).eq('id', showId);
      if(res.error){ alert("Couldn't save (" + res.error.message + ")."); return; }
      state.shows = state.shows.map(function(s){
        return s.id === showId ? Object.assign({}, s, {title: newTitle}) : s;
      });
      render();
    }catch(e){
      alert("Couldn't save. Check your connection and try again.");
    }
  }

  async function deleteShow(showId){
    if(!confirm("Delete this show? If nobody else has ranked it, it's removed for everyone. If someone else has, it'll only be removed from your list.")) return;
    try{
      var check = await sb.from('rankings').select('user_name').eq('show_id', showId).neq('user_name', state.user);
      if(check.error){ alert("Couldn't check first (" + check.error.message + "). Try again."); return; }
      var others = (check.data || []).length;
      if(others > 0){
        await sb.from('rankings').delete().eq('user_name', state.user).eq('show_id', showId);
        var next = Object.assign({}, state.ranking);
        delete next[showId];
        state.ranking = next;
        state.sheetShowId = null;
        render();
        alert((others === 1 ? 'Someone else has' : others + ' other people have') + " this ranked, so it stays on the shared list \u2014 it's been removed from your rankings only.");
        return;
      }
      var res = await sb.from('shows').delete().eq('id', showId);
      if(res.error){ alert("Couldn't delete (" + res.error.message + ")."); return; }
      state.shows = state.shows.filter(function(s){ return s.id !== showId; });
      var next2 = Object.assign({}, state.ranking);
      delete next2[showId];
      state.ranking = next2;
      state.sheetShowId = null;
      computeGenres();
      render();
    }catch(e){
      alert("Couldn't delete. Check your connection and try again.");
    }
  }

  function openManageFriends(){
    state.manageFriendsOpen = true;
    render();
  }
  function closeManageFriends(){
    state.manageFriendsOpen = false;
    render();
  }
  async function addFriend(name){
    if(state.myFriends.indexOf(name) !== -1) return;
    try{
      var res = await sb.from('friendships').insert({user_name: state.user, friend_name: name});
      if(res.error){ alert("Couldn't add friend (" + res.error.message + ")."); return; }
      state.myFriends = state.myFriends.concat([name]);
      render();
    }catch(e){
      alert("Couldn't add friend. Check your connection and try again.");
    }
  }
  async function removeFriend(name){
    try{
      var res = await sb.from('friendships').delete().eq('user_name', state.user).eq('friend_name', name);
      if(res.error){ alert("Couldn't remove friend (" + res.error.message + ")."); return; }
      state.myFriends = state.myFriends.filter(function(f){ return f !== name; });
      if(state.compareFriend === name){ state.compareFriend = null; state.friendRanking = {}; }
      render();
    }catch(e){
      alert("Couldn't remove friend. Check your connection and try again.");
    }
  }

  async function removePerson(username){
    if(username === state.user){ alert("You can't remove yourself here."); return; }
    if(!confirm('Remove ' + username + '? This deletes their rankings and profile. Shows they added stay if someone else has ranked them.')) return;
    try{
      var rankRes = await sb.from('rankings').delete().eq('user_name', username);
      if(rankRes.error){ alert("Couldn't remove their rankings (" + rankRes.error.message + "). Nothing was removed."); return; }

      var theirShows = state.shows.filter(function(s){ return s.addedBy === username; });
      for(var i=0;i<theirShows.length;i++){
        var s = theirShows[i];
        var check = await sb.from('rankings').select('user_name').eq('show_id', s.id);
        if(check.data && check.data.length > 0){
          var updRes = await sb.from('shows').update({added_by: null}).eq('id', s.id);
          if(updRes.error){ alert("Couldn't update one of their shows (" + updRes.error.message + "). Stopped before removing the person."); return; }
        } else {
          var delRes = await sb.from('shows').delete().eq('id', s.id);
          if(delRes.error){ alert("Couldn't remove one of their shows (" + delRes.error.message + "). Stopped before removing the person."); return; }
        }
      }

      var userRes = await sb.from('users').delete().eq('name', username);
      if(userRes.error){ alert("Couldn't remove " + username + " (" + userRes.error.message + ")."); return; }

      await loadShared();
      render();
    }catch(e){
      alert("Couldn't remove that person. Check your connection and try again.");
    }
  }

  function normalizeText(s){
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }

  function findSimilarGenre(typed){
    var norm = normalizeText(typed);
    var set = {};
    DEFAULT_GENRES.forEach(function(g){ set[g] = true; });
    (state.dbGenres || []).forEach(function(g){ set[g] = true; });
    state.shows.forEach(function(s){ set[s.genre] = true; });
    var candidates = Object.keys(set);
    for(var i=0;i<candidates.length;i++){
      var c = candidates[i];
      if(normalizeText(c) === norm && c !== typed) return c;
    }
    for(var j=0;j<candidates.length;j++){
      var c2 = candidates[j];
      var n2 = normalizeText(c2);
      if(n2 !== norm && Math.min(n2.length, norm.length) >= 3 && (n2.indexOf(norm) !== -1 || norm.indexOf(n2) !== -1)){
        return c2;
      }
    }
    return null;
  }

  function findSimilarShows(typedTitle){
    var norm = normalizeText(typedTitle);
    var matches = [];
    state.shows.forEach(function(s){
      var n = normalizeText(s.title);
      if(n === norm){ matches.push(s); return; }
      if(Math.min(n.length, norm.length) >= 3 && (n.indexOf(norm) !== -1 || norm.indexOf(n) !== -1)){
        matches.push(s);
      }
    });
    return matches.slice(0, 3);
  }

  async function performAddShow(title, genre){
    var err = document.getElementById('tw-add-error');
    if(err) err.textContent = 'Saving…';
    try{
      var res = await sb.from('shows').insert({
        title: title, genre: genre, poster: null, added_by: state.user
      }).select().single();
      if(res.error){ if(err) err.textContent = "Couldn't save (" + res.error.message + "). Try again."; return; }
      var show = {id: res.data.id, title: res.data.title, genre: res.data.genre, poster: res.data.poster, addedBy: res.data.added_by};
      state.shows = state.shows.concat([show]);
      computeGenres();
      state.genre = genre;
      state.addGenreMode = false;
      state.addConfirm = null;
      state.addDraftTitle = '';
      state.addDraftGenre = '';
      state.tab = 'mytiers';
      render();
    }catch(e){
      if(err) err.textContent = "Couldn't save. Check your connection and try again.";
    }
  }

  async function submitShow(ev){
    ev.preventDefault();
    var title = document.getElementById('tw-show-title').value.trim();
    var genre;
    if(state.addGenreMode){
      genre = document.getElementById('tw-new-genre').value.trim();
    } else {
      genre = document.getElementById('tw-genre-select').value;
    }
    var err = document.getElementById('tw-add-error');
    if(!title){ err.textContent = 'Enter a title first.'; return; }
    if(!genre){ err.textContent = 'Pick or enter a genre first.'; return; }
    err.textContent = '';
    state.addDraftTitle = title;
    state.addDraftGenre = genre;

    var genreMatch = state.addGenreMode ? findSimilarGenre(genre) : null;
    var titleMatches = findSimilarShows(title);
    if(genreMatch || titleMatches.length){
      state.addConfirm = {title: title, genre: genre, genreMatch: genreMatch, titleMatches: titleMatches};
      render();
      return;
    }
    await performAddShow(title, genre);
  }

          '<button data-action="pickphoto" style="display:flex;align-items:center;gap:10px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;color:var(--text);font-size:14px;font-weight:500;">' + cameraSvg + '<span>Change photo</span></button>' +
          '<button data-action="changename" style="display:flex;align-items:center;gap:10px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;color:var(--text);font-size:14px;font-weight:500;">' + editSvg + '<span>Change name</span></button>' +
          '<button data-action="setpin" style="display:flex;align-items:center;gap:10px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;color:var(--text);font-size:14px;font-weight:500;">' + lockSvg + '<span>Lock my name with a PIN</span></button>' +
          (state.user === OWNER_USERNAME ? '<button data-action="openpeople" style="display:flex;align-items:center;gap:10px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;color:var(--text);font-size:14px;font-weight:500;">' + peopleSvg + '<span>Manage people</span></button>' : '') +
          '<button data-action="switchuser" style="display:flex;align-items:center;gap:10px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:14px;font-weight:500;">' + swapSvg + '<span>Switch user</span></button>' +
        '</div>' +
      '</div>';
  }

  function showCard(show, tier, opts){
    opts = opts || {};
    var meta = tier ? TIER_META[tier] : null;
    var borderColor = meta ? meta.color : 'var(--border)';
    var extra = '';
    if(opts.compareBadge){
      extra = '<div style="font-family:var(--font-mono);font-size:10px;color:' + opts.compareBadge.color + ';margin-top:3px;">' + esc(opts.compareBadge.text) + '</div>';
    }
    var dataAttr = opts.clickable ? ' data-action="opensheet" data-showid="' + esc(show.id) + '"' : '';
    return '<div' + dataAttr + ' style="background:var(--surface2);border:1px solid var(--border);border-left:4px solid ' + borderColor + ';border-radius:6px;padding:9px 11px;min-width:0;' + (opts.clickable ? 'cursor:pointer;' : '') + '">' +
        '<div style="font-size:13.5px;font-weight:500;line-height:1.3;word-break:break-word;">' + esc(show.title) + '</div>' +
        extra +
      '</div>';
  }

  function tierShelf(tier, cardsHtml){
    var meta = TIER_META[tier];
    return '<div style="display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);align-items:stretch;">' +
        '<div style="flex:none;width:44px;border-radius:6px;background:' + meta.color + ';color:' + meta.text + ';display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-size:22px;">' +
          tier +
        '</div>' +
        '<div style="flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;min-height:44px;">' +
          (cardsHtml || '<div style="grid-column:1/-1;color:var(--text-muted);font-size:12px;font-family:var(--font-mono);align-self:center;">empty</div>') +
        '</div>' +
      '</div>';
  }

  function renderMyTiers(){
    var showsInGenre = state.shows.filter(function(s){
      return s.genre === state.genre && (s.addedBy === state.user || state.ranking[s.id]);
    });
    var body = '';
    if(showsInGenre.length === 0){
      body = '<div style="padding:40px 24px;text-align:center;">' +
          '<div style="font-family:var(--font-display);font-size:22px;color:var(--text-muted);">NO SHOWS YET</div>' +
          '<div style="font-size:13px;color:var(--text-muted);margin:8px 0 18px;">Add the first ' + esc(state.genre) + ' pick to start the shelf.</div>' +
          '<button data-action="settab" data-tab="add" style="background:var(--gold);color:var(--gold-text);border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;">Add a show</button>' +
        '</div>';
    } else {
      TIERS.forEach(function(t){
        var inTier = showsInGenre.filter(function(s){ return state.ranking[s.id] === t; });
        var cards = inTier.map(function(s){
          return showCard(s, t, {clickable:true});
        }).join('');
        body += tierShelf(t, cards);
      });
      var unranked = showsInGenre.filter(function(s){ return !state.ranking[s.id]; });
      if(unranked.length){
        body += '<div style="padding:14px 16px 6px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:.5px;">UNRANKED</div>';
        body += '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 16px 16px;">' +
            unranked.map(function(s){ return showCard(s, null, {clickable:true}); }).join('') +
          '</div>';
      }
      body += '<div style="padding:4px 16px 20px;">' +
          '<button data-action="settab" data-tab="add" style="width:100%;background:var(--surface2);border:1px dashed var(--border);color:var(--text);border-radius:8px;padding:11px;font-weight:500;font-size:13.5px;">+ Add another ' + esc(state.genre) + ' show</button>' +
        '</div>';
    }
    return genreChips(state.genres, state.genre, 'setgenre', true, myGenreCount) + body;
  }

  function renderCompare(){
    var others = state.users.filter(function(u){ return u !== state.user; });

    if(others.length === 0){
      return '<div style="padding:40px 24px;text-align:center;">' +
          '<div style="font-family:var(--font-display);font-size:20px;color:var(--text-muted);">NO ONE ELSE YET</div>' +
          '<div style="font-size:13px;color:var(--text-muted);margin-top:8px;">Send them this link. Once they join, you can add them as a friend here.</div>' +
        '</div>';
    }
    if(state.myFriends.length === 0){
      return '<div style="padding:40px 24px;text-align:center;">' +
          '<div style="font-family:var(--font-display);font-size:20px;color:var(--text-muted);">NO FRIENDS ADDED</div>' +
          '<div style="font-size:13px;color:var(--text-muted);margin:8px 0 18px;">Pick who you want to see in this tab.</div>' +
          '<button data-action="openmanagefriends" style="background:var(--gold);color:var(--gold-text);border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;">Add a friend</button>' +
        '</div>';
    }
    if(!state.compareFriend){
      return friendPicker() + '<div style="padding:40px 24px;text-align:center;color:var(--text-muted);font-size:13px;">Pick a friend above to see their tiers.</div>';
    }
    if(state.compareGenres.length === 0){
      return friendPicker() + '<div style="padding:40px 24px;text-align:center;color:var(--text-muted);font-size:13px;">' + esc(state.compareFriend) + " hasn't added or ranked anything yet.</div>";
    }

    var showsInGenre = state.shows.filter(function(s){
      return s.genre === state.compareGenre && (s.addedBy === state.compareFriend || state.friendRanking[s.id]);
    });
    var body = friendPicker();
    body += '<div style="display:flex;align-items:center;gap:10px;padding:12px 16px 0;">' + avatarCircle(state.compareFriend, 28) + '<div style="font-size:13px;color:var(--text-muted);">Viewing ' + esc(state.compareFriend) + "'s tiers</div></div>";
    body += genreChips(state.compareGenres, state.compareGenre, 'setcomparegenre', false, compareGenreCount);
    if(showsInGenre.length === 0){
      body += '<div style="padding:40px 24px;text-align:center;color:var(--text-muted);font-size:13px;">No ' + esc(state.compareGenre) + ' shows here yet.</div>';
    } else {
      TIERS.forEach(function(t){
        var inTier = showsInGenre.filter(function(s){ return state.friendRanking[s.id] === t; });
        var cards = inTier.map(function(s){
          var mine = state.ranking[s.id];
          var badge = null;
          if(mine){
            badge = mine === t
              ? {color:'var(--teal)', text:'YOU AGREE ON ' + t}
              : {color:'var(--text-muted)', text:'YOU HAVE IT ' + mine};
          }
          return showCard(s, t, {compareBadge: badge, clickable:true});
        }).join('');
        body += tierShelf(t, cards);
      });
      var friendUnranked = showsInGenre.filter(function(s){ return !state.friendRanking[s.id]; });
      if(friendUnranked.length){
        body += '<div style="padding:14px 16px 6px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:.5px;">NOT YET RANKED BY ' + esc(state.compareFriend.toUpperCase()) + '</div>';
        body += '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 16px 16px;">' +
            friendUnranked.map(function(s){ return showCard(s, null, {clickable:true}); }).join('') +
          '</div>';
      }
    }
    return body;
  }

  function renderAddConfirm(){
    var c = state.addConfirm;
    var body = '<div style="padding:20px 20px 28px;">' +
        '<div style="font-family:var(--font-display);font-size:24px;margin-bottom:14px;">JUST CHECKING</div>';

    if(c.genreMatch){
      body += '<div style="font-size:14px;margin-bottom:14px;">You typed <strong>' + esc(c.genre) + '</strong> as a new genre \u2014 there\'s already a genre called <strong>' + esc(c.genreMatch) + '</strong>. Use that instead?</div>' +
        '<button data-action="acceptgenre" style="width:100%;background:var(--gold);color:var(--gold-text);border:none;border-radius:8px;padding:12px;font-weight:600;font-size:14px;margin-bottom:8px;">Use "' + esc(c.genreMatch) + '"</button>' +
        '<button data-action="keepnewgenre" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:12px;font-weight:500;font-size:14px;margin-bottom:8px;">Keep "' + esc(c.genre) + '" as a new genre</button>';
    } else if(c.titleMatches && c.titleMatches.length){
      body += '<div style="font-size:14px;margin-bottom:14px;">"' + esc(c.title) + '" looks similar to what\'s already on the shared list:</div>';
      c.titleMatches.forEach(function(m){
        body += '<button data-action="usematch" data-showid="' + esc(m.id) + '" style="display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:8px;color:var(--text);">' +
            '<span style="display:block;font-size:14px;font-weight:500;">' + esc(m.title) + '</span>' +
            '<span style="display:block;font-size:11px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px;">' + esc(m.genre.toUpperCase()) + ' \u2014 tap to rank this one</span>' +
          '</button>';
      });
      body += '<button data-action="addanyway" style="width:100%;background:none;border:1px dashed var(--border);color:var(--text-muted);border-radius:8px;padding:11px;font-size:13px;margin-top:6px;">Add "' + esc(c.title) + '" as a new show anyway</button>';
    }

    body += '<button data-action="canceladd" style="width:100%;background:none;border:none;color:var(--text-muted);font-size:13px;margin-top:14px;text-decoration:underline;">Go back and edit</button>' +
      '</div>';
    return body;
  }

  function renderVerdict(){
    if(state.verdictGenres.length === 0){
      return '<div style="padding:40px 24px;text-align:center;">' +
          '<div style="font-family:var(--font-display);font-size:20px;color:var(--text-muted);">NO VERDICTS YET</div>' +
          '<div style="font-size:13px;color:var(--text-muted);margin-top:8px;">Once shows get ranked, the group\'s consensus shows up here.</div>' +
        '</div>';
    }

    var byShow = {};
    state.allRankings.forEach(function(r){
      if(!byShow[r.show_id]) byShow[r.show_id] = [];
      byShow[r.show_id].push(r.tier);
    });

    var entries = state.shows
      .filter(function(s){ return s.genre === state.verdictGenre && byShow[s.id] && byShow[s.id].length >= 2; })
      .map(function(s){
        var tiers = byShow[s.id];
        var sum = 0;
        tiers.forEach(function(t){ sum += TIER_SCORE[t] || 0; });
        var avg = sum / tiers.length;
        var letterIdx = Math.min(3, Math.max(0, Math.round(avg) - 1));
        var letter = TIER_ORDER[letterIdx];
        return {show: s, avg: avg, count: tiers.length, letter: letter};
      })
      .sort(function(a, b){
        if(b.avg !== a.avg) return b.avg - a.avg;
        if(b.count !== a.count) return b.count - a.count;
        return a.show.title.localeCompare(b.show.title);
      });

    var body = genreChips(state.verdictGenres, state.verdictGenre, 'setverdictgenre', false, verdictGenreCount);

    if(entries.length === 0){
      body += '<div style="padding:40px 24px;text-align:center;color:var(--text-muted);font-size:13px;">Nothing in ' + esc(state.verdictGenre) + ' has been ranked by more than one person yet.</div>';
      return body;
    }

    body += '<div style="padding:8px 16px 20px;">';
    entries.forEach(function(e, i){
      var meta = TIER_META[e.letter];
      body += '<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);">' +
          '<div style="flex:none;width:26px;font-family:var(--font-display);font-size:20px;color:var(--text-muted);text-align:center;">' + (i + 1) + '</div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-size:14px;font-weight:500;line-height:1.3;word-break:break-word;">' + esc(e.show.title) + '</div>' +
            '<div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:2px;">ranked by ' + e.count + '</div>' +
          '</div>' +
          '<div style="flex:none;width:34px;height:34px;border-radius:6px;background:' + meta.color + ';color:' + meta.text + ';display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px;">' + e.letter + '</div>' +
        '</div>';
    });
    body += '</div>';
    return body;
  }

  function renderAdd(){
    if(state.addConfirm) return renderAddConfirm();
    var genreField = state.addGenreMode
      ? '<input id="tw-new-genre" placeholder="New genre name" maxlength="20" value="' + esc(state.addDraftGenre || '') + '" />' +
        '<button type="button" data-action="togglenewgenre" style="margin-top:6px;background:none;border:none;color:var(--text-muted);font-size:12px;text-decoration:underline;">Choose existing genre instead</button>'
      : '<select id="tw-genre-select">' +
          state.genres.map(function(g){ return '<option value="' + esc(g) + '"' + (g===state.genre?' selected':'') + '>' + esc(g) + '</option>'; }).join('') +
        '</select>' +
        '<button type="button" data-action="togglenewgenre" style="margin-top:6px;background:none;border:none;color:var(--text-muted);font-size:12px;text-decoration:underline;">Add a new genre instead</button>';

    return '<form id="tw-add-form" style="padding:20px 20px 28px;">' +
        '<div style="font-family:var(--font-display);font-size:26px;margin-bottom:14px;">ADD A SHOW</div>' +
        '<label style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);">TITLE</label>' +
        '<div style="margin:6px 0 14px;"><input id="tw-show-title" placeholder="e.g. The Bear" maxlength="80" value="' + esc(state.addDraftTitle || '') + '" /></div>' +
        '<label style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);">GENRE</label>' +
        '<div style="margin:6px 0 4px;">' + genreField + '</div>' +
        '<div id="tw-add-error" style="color:var(--rose);font-size:13px;margin-top:10px;"></div>' +
        '<button type="submit" style="margin-top:18px;width:100%;background:var(--gold);color:var(--gold-text);border:none;border-radius:8px;padding:12px;font-weight:600;font-size:15px;">Add to shelf</button>' +
      '</form>';
  }

  function bottomNav(){
    function item(tab, label, svg){
      var active = state.tab === tab;
      return '<button data-action="settab" data-tab="' + tab + '" style="flex:1;background:none;border:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:' + (active ? 'var(--gold)' : 'var(--text-muted)') + ';">' +
          svg +
          '<span style="font-size:10.5px;font-family:var(--font-mono);letter-spacing:.3px;">' + label + '</span>' +
        '</button>';
    }
    var listSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>';
    var compareSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2 20c0-3 3-5 6-5s6 2 6 5"/><path d="M10 20c0-3 3-5 6-5s6 2 6 5"/></svg>';
    var plusSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>';
    var verdictSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="14" width="4" height="7"/><rect x="10" y="9" width="4" height="12"/><rect x="17" y="4" width="4" height="17"/></svg>';
    return '<div style="display:flex;border-top:1px solid var(--border);background:var(--surface);position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom);">' +
        item('mytiers', 'MY TIERS', listSvg) +
        item('add', 'ADD', plusSvg) +
        item('compare', 'FRIENDS', compareSvg) +
        item('verdict', 'VERDICT', verdictSvg) +
      '</div>';
  }

  function sheet(){
    if(!state.sheetShowId) return '';
    var show = state.shows.filter(function(s){ return s.id === state.sheetShowId; })[0];
    if(!show) return '';
    var current = state.ranking[show.id];
    var rows = TIERS.map(function(t){
      var meta = TIER_META[t];
      var isCurrent = current === t;
      return '<button data-action="settier" data-showid="' + esc(show.id) + '" data-tier="' + t + '" style="display:flex;align-items:center;gap:12px;width:100%;background:' + (isCurrent ? meta.color : 'var(--surface2)') + ';border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:8px;">' +
          '<span style="font-family:var(--font-display);font-size:20px;color:' + (isCurrent ? meta.text : meta.color) + ';width:26px;">' + t + '</span>' +
          '<span style="text-align:left;flex:1;">' +
            '<span style="display:block;font-size:14px;font-weight:500;color:' + (isCurrent ? meta.text : 'var(--text)') + ';">' + meta.label + '</span>' +
            '<span style="display:block;font-size:11px;color:' + (isCurrent ? meta.text : 'var(--text-muted)') + ';">' + meta.sub + '</span>' +
          '</span>' +
        '</button>';
    }).join('');
    var removeRow = current ? '<button data-action="settier" data-showid="' + esc(show.id) + '" data-tier="" style="width:100%;background:none;border:1px dashed var(--border);border-radius:8px;padding:10px;color:var(--text-muted);font-size:13px;margin-top:2px;">Remove from tier list</button>' : '';
    var editRow = '<button data-action="editshow" data-showid="' + esc(show.id) + '" style="width:100%;background:none;border:none;padding:10px;color:var(--text-muted);font-size:13px;margin-top:6px;font-weight:500;">Edit title</button>';
    var deleteRow = '<button data-action="deleteshow" data-showid="' + esc(show.id) + '" style="width:100%;background:none;border:none;padding:10px;color:var(--rose);font-size:13px;font-weight:500;">Delete show</button>';
    return '<div data-action="closesheet" style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:5;">' +
        '<div data-action="stop" style="background:var(--surface);width:100%;max-width:480px;margin:0 auto;border-radius:16px 16px 0 0;padding:18px 16px 22px;border-top:1px solid var(--border);">' +
          '<div style="width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;"></div>' +
          '<div style="font-size:15px;font-weight:600;margin-bottom:2px;">' + esc(show.title) + '</div>' +
          '<div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);margin-bottom:14px;">' + esc(show.genre.toUpperCase()) + '</div>' +
          rows + removeRow + editRow + deleteRow +
        '</div>' +
      '</div>';
  }

  function render(){
    if(state.loading){ renderLoading(); return; }
    var prevScrollEl = document.getElementById('tw-genre-scroll');
    var prevScroll = prevScrollEl ? prevScrollEl.scrollLeft : 0;
    var body;
    if(state.tab === 'compare') body = renderCompare();
    else if(state.tab === 'add') body = renderAdd();
    else if(state.tab === 'verdict') body = renderVerdict();
    else body = renderMyTiers();

    root.innerHTML =
      '<div style="position:relative;min-height:100vh;display:flex;flex-direction:column;">' +
        header() +
        '<div style="min-height:280px;flex:1;">' + body + '</div>' +
        bottomNav() +
        sheet() +
        profileSheet() +
        manageGenresSheet() +
        managePeopleSheet() +
        manageFriendsSheet() +
        addToHomeModal() +
      '</div>';

    var newScrollEl = document.getElementById('tw-genre-scroll');
    if(newScrollEl) newScrollEl.scrollLeft = prevScroll;

    var addForm = document.getElementById('tw-add-form');
    if(addForm){
      addForm.addEventListener('submit', submitShow);
    }
  }

  root.addEventListener('click', function(ev){
    var t = ev.target;
    if(t && t.nodeType === 3) t = t.parentNode;
    if(!t || !t.closest) return;
    var el = t.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');
    if(action === 'stop'){ ev.stopPropagation(); return; }
    if(action === 'settab'){ setTab(el.getAttribute('data-tab')); }
    else if(action === 'setgenre'){ setGenre(el.getAttribute('data-genre')); }
    else if(action === 'setcomparegenre'){ state.compareGenre = el.getAttribute('data-genre'); render(); }
    else if(action === 'selectfriendchip'){ selectFriend(el.getAttribute('data-username')); }
    else if(action === 'openmanagefriends'){ openManageFriends(); }
    else if(action === 'closemanagefriends'){ closeManageFriends(); }
    else if(action === 'addfriend'){ addFriend(el.getAttribute('data-username')); }
    else if(action === 'removefriend'){ removeFriend(el.getAttribute('data-username')); }
    else if(action === 'setverdictgenre'){ state.verdictGenre = el.getAttribute('data-genre'); render(); }
    else if(action === 'opensheet'){ openSheet(el.getAttribute('data-showid')); }
    else if(action === 'closesheet'){ closeSheet(); }
    else if(action === 'settier'){
      var tier = el.getAttribute('data-tier');
      setTier(el.getAttribute('data-showid'), tier === '' ? null : tier);
    }
    else if(action === 'togglenewgenre'){ toggleNewGenre(); }
    else if(action === 'switchuser'){ switchUser(); }
    else if(action === 'openprofile'){ openProfile(); }
    else if(action === 'closeprofile'){ closeProfile(); }
    else if(action === 'pickphoto'){ pickPhoto(); }
    else if(action === 'changename'){ changeNamePrompt(); }
    else if(action === 'setpin'){ setPinPrompt(); }
    else if(action === 'clearpin'){ clearPersonPin(el.getAttribute('data-username')); }
    else if(action === 'deleteshow'){ deleteShow(el.getAttribute('data-showid')); }
    else if(action === 'editshow'){ editShow(el.getAttribute('data-showid')); }
    else if(action === 'shareapp'){ shareApp(); }
    else if(action === 'acceptgenre'){ resolveAddConfirmGenre(true); }
    else if(action === 'keepnewgenre'){ resolveAddConfirmGenre(false); }
    else if(action === 'usematch'){ useMatchedShow(el.getAttribute('data-showid')); }
    else if(action === 'addanyway'){ addAnyway(); }
    else if(action === 'canceladd'){ cancelAddConfirm(); }
    else if(action === 'openmanage'){ openManageGenres(); }
    else if(action === 'closemanage'){ closeManageGenres(); }
    else if(action === 'togglehidegenre'){ toggleHideGenre(el.getAttribute('data-genre')); }
    else if(action === 'removeemptygenre'){ removeEmptyGenre(el.getAttribute('data-genre')); }
    else if(action === 'addnewgenre'){ addNewGenreLabel(); }
    else if(action === 'openpeople'){ openManagePeople(); }
    else if(action === 'closepeople'){ closeManagePeople(); }
    else if(action === 'removeperson'){ removePerson(el.getAttribute('data-username')); }
    else if(action === 'dismissaddtohome'){ dismissAddToHome(); }
  });

  root.addEventListener('change', function(ev){
    var t = ev.target;
    if(t && t.nodeType === 3) t = t.parentNode;
    if(!t || !t.closest) return;
    var el = t.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');
    if(action === 'friendchange'){ selectFriend(el.value); }
    else if(action === 'avatarfile'){ uploadAvatar(el.files && el.files[0]); }
  });

  init();
})();
</script>
</body>
</html>
